services:
  back:
    build: ./back
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      # Origem do front publicada abaixo (front.ports), para o CORS liberar
      # exatamente quem pode chamar a API.
      CORS_ORIGIN: http://localhost:3000
      DATA_FILE: /data/tasks.json
    volumes:
      - back-data:/data
    restart: unless-stopped

  front:
    build:
      context: ./front
      args:
        # Baked no bundle em build time — precisa ser a URL onde o back
        # fica acessível a partir do NAVEGADOR do usuário (não o nome do
        # serviço Docker, que só resolve entre containers).
        VITE_API_URL: http://localhost:8080
    ports:
      - '3000:80'
    depends_on:
      - back
    restart: unless-stopped

volumes:
  back-data:
